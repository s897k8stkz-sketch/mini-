name: Build paper (C2)

# 目的：对 paper.tex 执行真实的 LaTeX 编译，产出可公开核验的编译证据
# （PDF + 编译日志 + 未解析引用检查）。用于消除「核心交付物未经真实编译验证」的短板。

on:
  push:
    branches: [main]
    paths:
      - 'paper.tex'
      - 'references.bib'
      - '.github/workflows/build-paper.yml'
      - 'c2-f1-probe/**'
  workflow_dispatch:

permissions:
  contents: write   # 仅用于把编译产物(PDF/日志/证据表)回写到 build/ 目录

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live (pdflatex + bibtex) and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-fonts-recommended poppler-utils

      - name: Report toolchain versions
        run: |
          pdflatex --version | head -n 2
          bibtex --version | head -n 1

      - name: Reproduce the fidelity probe (statement-drift checker)
        run: |
          cd c2-f1-probe
          python3 run-probe.py
          python3 check-metrics.py | tee probe-metrics.md
          python3 check-metrics.py >> "$GITHUB_STEP_SUMMARY"

      - name: Compile (pdflatex -> bibtex -> pdflatex -> pdflatex)
        run: |
          pdflatex -interaction=nonstopmode paper.tex > compile-pass1.log 2>&1 || true
          bibtex paper > bibtex.log 2>&1 || true
          pdflatex -interaction=nonstopmode paper.tex > compile-pass2.log 2>&1 || true
          pdflatex -interaction=nonstopmode paper.tex > compile-pass3.log 2>&1 || true
          echo '--- pass 1 (tail) ---'; tail -n 20 compile-pass1.log
          echo '--- bibtex ---'; cat bibtex.log
          echo '--- pass 3 (tail) ---'; tail -n 20 compile-pass3.log

      - name: Verify output and emit evidence
        run: |
          test -f paper.pdf || { echo '::error::paper.pdf was not produced'; exit 1; }
          echo '== artifact =='; ls -l paper.pdf; file paper.pdf
          echo '== page info =='; pdfinfo paper.pdf | grep -E 'Pages|Page size|Producer' || true
          echo '== Output written line =='
          grep -E 'Output written on paper.pdf' compile-pass3.log || {
            echo '::error::no "Output written" line in final pass log'; exit 1; }
          echo '== unresolved citations / references =='
          if grep -E 'Citation .* undefined|Reference .* undefined|There were undefined references' compile-pass3.log; then
            echo '::error::undefined citations or cross-references remain'; exit 1
          fi
          echo 'OK: 0 undefined citations, 0 undefined cross-references'
          echo '== warning count =='
          grep -c 'LaTeX Warning' compile-pass3.log || true

      - name: Run summary
        if: always()
        run: |
          {
            echo '## C2 paper build evidence'
            echo ''
            echo '```'
            grep -E 'Output written on paper.pdf' compile-pass3.log || echo '(no Output written line)'
            echo '```'
            echo ''
            echo "- undefined citations/cross-references: $(grep -cE 'Citation .* undefined|Reference .* undefined' compile-pass3.log || true)"
            echo "- LaTeX warnings in final pass: $(grep -c 'LaTeX Warning' compile-pass3.log || true)"
            echo "- bibtex log:"; echo '```'; cat bibtex.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-build-evidence
          path: |
            paper.pdf
            compile-pass1.log
            compile-pass3.log
            bibtex.log
            c2-f1-probe/probe-metrics.md
            c2-f1-probe/probe-output/results.json

      # 把编译产物回写进仓库 build/ ，使证据不依赖登录即可核验（artifact 需登录才能下载）
      - name: Publish build evidence into the repository
        run: |
          mkdir -p build
          cp paper.pdf build/paper.pdf
          cp compile-pass3.log build/compile-log.txt
          cp c2-f1-probe/probe-metrics.md build/PROBE-EVIDENCE.md
          PAGES=$(pdfinfo paper.pdf | awk '/^Pages/{print $2}')
          WRITTEN=$(grep -E 'Output written on paper.pdf' compile-pass3.log | head -n 1)
          UNDEF=$(grep -cE 'Citation .* undefined|Reference .* undefined' compile-pass3.log || true)
          WARN=$(grep -c 'LaTeX Warning' compile-pass3.log || true)
          {
            echo '# Build evidence — C2 paper.tex'
            echo ''
            echo 'This file is machine-generated by GitHub Actions; it is not hand-written.'
            echo ''
            echo '| item | value |'
            echo '| --- | --- |'
            echo "| workflow run | $GITHUB_RUN_ID |"
            echo "| triggering commit | $GITHUB_SHA |"
            echo "| engine | $(pdflatex --version | head -n 1) |"
            echo "| bibtex | $(bibtex --version | head -n 1) |"
            echo "| pages | $PAGES |"
            echo "| undefined citations / cross-references | $UNDEF |"
            echo "| LaTeX warnings (final pass) | $WARN |"
            echo ''
            echo 'Final-pass log line:'
            echo ''
            echo '```'
            echo "$WRITTEN"
            echo '```'
            echo ''
            echo '## fidelity probe (c2-f1-probe)'
            echo ''
            sed -n '1,40p' c2-f1-probe/probe-metrics.md
            echo ''
            echo '## bibtex log'
            echo ''
            echo '```'
            cat bibtex.log
            echo '```'
          } > build/BUILD-EVIDENCE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build/paper.pdf build/compile-log.txt build/BUILD-EVIDENCE.md build/PROBE-EVIDENCE.md
          if git diff --cached --quiet; then
            echo 'no change in build evidence; nothing to publish'
          else
            git commit -m "CI: real LaTeX build evidence for paper.tex (run $GITHUB_RUN_ID) [skip ci]"
            git push origin HEAD:main
          fi
